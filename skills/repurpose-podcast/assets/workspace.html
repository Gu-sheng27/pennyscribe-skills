<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PennyScribe · Podcast Studio</title>
<style>
:root{--ink:#191816;--muted:#77736c;--paper:#f5f1e8;--panel:#fffdf8;--accent:#d8382f;--line:#ddd6c9;--shadow:0 22px 70px rgba(44,34,22,.12)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:var(--paper);font-family:Inter,"PingFang SC","Noto Sans CJK SC",system-ui,sans-serif}.shell{min-height:100vh}.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:24px;padding:14px 28px;background:rgba(245,241,232,.93);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.brand{font-family:Georgia,serif;font-weight:700;font-size:20px;white-space:nowrap}.brand b{color:var(--accent)}.tabs{display:flex;gap:6px;overflow:auto}.tabs button,.button,select{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:9px 14px;font:inherit;cursor:pointer}.tabs button.active{background:var(--ink);color:#fff;border-color:var(--ink)}.actions{margin-left:auto;display:flex;gap:8px}.button.primary{background:var(--accent);border-color:var(--accent);color:#fff}.view{display:none}.view.active{display:block}.page{width:min(1120px,calc(100% - 36px));margin:42px auto 90px}.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,.7fr);gap:42px;align-items:end;padding:44px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow)}.kicker{text-transform:uppercase;letter-spacing:.16em;color:var(--accent);font-size:12px;font-weight:800}.hero h1{font:700 clamp(38px,6vw,76px)/.98 Georgia,"Songti SC",serif;margin:14px 0 22px}.hero p{font-size:18px;line-height:1.8;color:#4c4944}.cover{aspect-ratio:1;border-radius:4px;background:linear-gradient(145deg,#241f1b,#6a211f);overflow:hidden;display:grid;place-items:center;color:#fff;font:700 40px Georgia}.cover img{width:100%;height:100%;object-fit:cover}.meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:22px}.panel{padding:28px;border:1px solid var(--line);background:var(--panel)}.panel h2,.panel h3{font-family:Georgia,"Songti SC",serif;margin-top:0}.bigquote{font:italic 26px/1.55 Georgia,"Songti SC",serif;border-left:4px solid var(--accent);padding-left:24px}.pill{display:inline-block;padding:7px 10px;border-radius:999px;background:#ede7da;margin:4px;font-size:13px}.reader-layout{display:grid;grid-template-columns:230px minmax(0,720px);gap:52px;justify-content:center}.toc{position:sticky;top:86px;align-self:start;max-height:calc(100vh - 110px);overflow:auto}.toc a{display:block;padding:8px 0;color:var(--muted);text-decoration:none;border-bottom:1px solid transparent}.toc a:hover{color:var(--accent)}.reader{background:var(--panel);padding:64px 72px;box-shadow:var(--shadow)}.reader h1{font:700 48px/1.08 Georgia,"Songti SC",serif}.reader .dek{font-size:19px;color:var(--muted);line-height:1.75}.reader section{padding-top:28px}.reader h2{font:700 30px/1.25 Georgia,"Songti SC",serif}.reader p{font:18px/2 Georgia,"Songti SC",serif;letter-spacing:.015em}.editable{outline:none;border-radius:3px}.editable:focus{background:#fff4ce;box-shadow:0 0 0 5px #fff4ce}.source-toggle{margin-top:40px}.raw{display:none;padding:24px;white-space:pre-wrap;background:#efebe2;color:#5d5851;line-height:1.7}.raw.show{display:block}.social-layout{display:grid;grid-template-columns:1fr 1fr;gap:26px}.post{padding:26px;margin-bottom:16px;border:1px solid var(--line);background:var(--panel);font-size:18px;line-height:1.65;white-space:pre-wrap}.post small{display:block;color:var(--muted);margin-top:12px}.thread-item{position:relative;padding-left:58px}.thread-item:before{content:attr(data-index);position:absolute;left:18px;top:24px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:#fff;font-size:12px}.xhs-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:24px}.cards{display:flex;flex-wrap:wrap;align-items:flex-start;gap:26px}.card-wrap{position:relative}.card-tools{display:flex;gap:6px;margin-top:8px}.card-tools button{border:1px solid var(--line);background:var(--panel);padding:6px 9px;border-radius:8px;cursor:pointer}.xhs-card{width:540px;height:720px;padding:54px;overflow:hidden;position:relative;display:flex;flex-direction:column;justify-content:space-between;background:#f5ead8;color:#18130f;box-shadow:var(--shadow);isolation:isolate}.xhs-card:after{content:attr(data-number);position:absolute;right:34px;top:28px;font:700 13px Georgia;letter-spacing:.14em}.xhs-card .eyebrow{font-size:13px;letter-spacing:.18em;text-transform:uppercase;font-weight:900}.xhs-card h2{font:800 50px/1.08 "PingFang SC","Noto Sans CJK SC",sans-serif;margin:24px 0}.xhs-card .body{font-size:23px;line-height:1.6;white-space:pre-wrap}.xhs-card footer{display:flex;justify-content:space-between;align-items:end;font-size:14px}.xhs-card .cover-art{position:absolute;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover;filter:saturate(.8)}.xhs-card .cover-shade{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(10,9,8,.12),rgba(10,9,8,.86))}.theme-editorial-red{background:#f3ead9;border:18px solid #d6382f}.theme-editorial-red h2{color:#c82d25}.theme-cream-notes{background:#f6eddb}.theme-cream-notes:before{content:"";position:absolute;inset:22px;border:1px solid #b7aa94;z-index:-1}.theme-cream-notes h2{font-family:Georgia,"Songti SC",serif}.theme-neo-brutal{background:#f5df35;border:6px solid #111;box-shadow:12px 12px 0 #111}.theme-neo-brutal h2{text-transform:uppercase}.theme-neo-brutal .eyebrow{background:#111;color:#fff;width:max-content;padding:8px}.theme-dark-cinema{background:#161616;color:#f6f0e7}.theme-dark-cinema h2{font-family:Georgia,"Songti SC",serif;color:#fff}.theme-dark-cinema:before{content:"";position:absolute;left:54px;top:34px;width:70px;height:3px;background:#cba86a}.empty{color:var(--muted);padding:32px;border:1px dashed var(--line);background:var(--panel)}.toast{position:fixed;right:22px;bottom:22px;background:#171614;color:#fff;padding:12px 16px;border-radius:10px;opacity:0;transform:translateY(8px);transition:.2s;z-index:50}.toast.show{opacity:1;transform:none}@media(max-width:820px){.topbar{flex-wrap:wrap;padding:12px}.actions{margin-left:0}.page{width:min(100% - 20px,720px);margin-top:20px}.hero,.grid,.social-layout{grid-template-columns:1fr}.hero{padding:28px}.reader-layout{display:block}.toc{position:relative;top:auto;margin-bottom:20px}.reader{padding:34px 25px}.cards{justify-content:center}.xhs-card{transform-origin:top left}.card-wrap{max-width:100%;overflow:auto}}
@media print{.topbar,.toc,.source-toggle,.raw,.card-tools,.xhs-toolbar{display:none!important}.view{display:none!important}.view.active{display:block!important}.page{width:100%;margin:0}.reader{box-shadow:none;padding:0}.reader p{font-size:12pt}}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">Penny<b>Scribe</b> Studio</div>
    <nav class="tabs">
      <button class="active" data-view="digest">导读与摘要</button>
      <button data-view="reader">阅读全文</button>
      <button data-view="x">X 素材</button>
      <button data-view="xhs">小红书素材</button>
    </nav>
    <div class="actions"><button class="button" id="saveJson">导出项目 JSON</button><button class="button primary" onclick="window.print()">打印 / PDF</button></div>
  </header>
  <main>
    <div class="view active" id="view-digest"><div class="page" id="digestRoot"></div></div>
    <div class="view" id="view-reader"><div class="page reader-layout"><aside class="toc" id="toc"></aside><article class="reader" id="readerRoot"></article></div></div>
    <div class="view" id="view-x"><div class="page" id="xRoot"></div></div>
    <div class="view" id="view-xhs"><div class="page"><div class="xhs-toolbar"><label>排版风格 <select id="theme"><option value="editorial-red">编辑红</option><option value="cream-notes">奶油手记</option><option value="neo-brutal">新粗野</option><option value="dark-cinema">暗色电影</option></select></label><button class="button" id="addCard">新增卡片</button><button class="button" id="copyCaption">复制标题与文案</button></div><section class="panel" id="xhsCopy"></section><div class="cards" id="cards" style="margin-top:26px"></div></div></div>
  </main>
</div>
<div class="toast" id="toast"></div>
<script id="project-data" type="application/json">__PROJECT_DATA__</script>
<script>
const state=JSON.parse(document.getElementById('project-data').textContent);const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const source=state.source||{};const transcript=state.transcript||{};const readable=transcript.readable||{};const digest=state.digest||{};const x=state.x||{};const xhs=state.xiaohongshu||{};
function toast(text){const el=$('#toast');el.textContent=text;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
document.querySelectorAll('.tabs button').forEach(button=>button.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===button));document.querySelectorAll('.view').forEach(view=>view.classList.toggle('active',view.id===`view-${button.dataset.view}`))});
function renderDigest(){const cover=source.cover?`<img src="${esc(source.cover)}" alt="">`:'PS';const insights=(digest.insights||[]).map((x,i)=>`<li class="editable" data-insight="${i}" contenteditable="true">${esc(x.text)}</li>`).join('');const quotes=(digest.quotes||[]).map((x,i)=>`<blockquote class="bigquote editable" data-quote="${i}" contenteditable="true">${esc(x.text)}</blockquote>`).join('');$('#digestRoot').innerHTML=`<section class="hero"><div><div class="kicker">${esc(source.platform||'PODCAST')} · READING EDITION</div><h1 class="editable" data-readable-title contenteditable="true">${esc(readable.title||source.title||'Untitled')}</h1><p class="editable" data-recommendation contenteditable="true">${esc(digest.recommendation||readable.dek||'')}</p><div class="meta"><span>${esc(source.creator||'')}</span><span>${esc(source.published_at||'')}</span><a href="${esc(source.url||'#')}" target="_blank" rel="noreferrer">原节目链接 ↗</a></div></div><div class="cover">${cover}</div></section><div class="grid"><section class="panel"><h2>本期摘要</h2><p class="editable" data-summary contenteditable="true">${esc(digest.summary||'')}</p><h3>核心观点</h3><ul>${insights||'<li>尚未生成</li>'}</ul></section><section class="panel"><h2>精选引语</h2>${quotes||'<p class="empty">尚未生成精选引语</p>'}<h3>适合谁</h3>${(digest.audience||[]).map(v=>`<span class="pill">${esc(v)}</span>`).join('')}</section></div>`}
function renderReader(){const sections=readable.sections||[];$('#toc').innerHTML=`<div class="kicker">CONTENTS</div>${sections.map(s=>`<a href="#${esc(s.id)}">${esc(s.heading)}</a>`).join('')}`;$('#readerRoot').innerHTML=`<div class="kicker">FULL TRANSCRIPT</div><h1 class="editable" data-reader-title contenteditable="true">${esc(readable.title||source.title||'阅读全文')}</h1><p class="dek editable" data-reader-dek contenteditable="true">${esc(readable.dek||'')}</p>${sections.map((section,index)=>`<section id="${esc(section.id)}"><h2 class="editable" data-section-heading="${index}" contenteditable="true">${esc(section.heading)}</h2>${(section.paragraphs||[]).map(p=>`<p class="editable transcript-paragraph" data-paragraph-id="${esc(p.id)}" contenteditable="true">${esc(p.text)}</p>`).join('')}</section>`).join('')}<div class="source-toggle"><button class="button" id="toggleRaw">显示 / 隐藏原始转写</button><button class="button" id="copyMarkdown">复制全文 Markdown</button></div><div class="raw" id="raw">${esc(transcript.raw||'')}</div>`;$('#toggleRaw').onclick=()=>$('#raw').classList.toggle('show');$('#copyMarkdown').onclick=()=>{sync();const md=sections.map(s=>`## ${s.heading}\n\n${(s.paragraphs||[]).map(p=>p.text).join('\n\n')}`).join('\n\n');navigator.clipboard.writeText(`# ${readable.title||source.title}\n\n${md}`);toast('已复制 Markdown')}}
function renderX(){const posts=(x.single_posts||[]).map((p,i)=>`<div class="post editable" data-x-post="${i}" contenteditable="true">${esc(p.text)}</div>`).join('');const threads=(x.threads||[]).map((thread,ti)=>`<section class="panel"><h2>Thread ${ti+1}</h2>${thread.map((p,i)=>`<div class="post thread-item editable" data-index="${i+1}" data-thread="${ti}" data-thread-item="${i}" contenteditable="true">${esc(p.text)}</div>`).join('')}<button class="button" onclick="copyThread(${ti})">复制 Thread</button></section>`).join('');$('#xRoot').innerHTML=`<div class="kicker">X PUBLISHING</div><h1>独立文案</h1><div class="social-layout"><section><h2>Single posts</h2>${posts||'<div class="empty">尚未生成 X 文案</div>'}</section><section>${threads||'<div class="empty">尚未生成 Thread</div>'}</section></div>`}
window.copyThread=i=>{sync();navigator.clipboard.writeText((x.threads[i]||[]).map(p=>p.text).join('\n\n'));toast('已复制 Thread')};
function renderCards(){xhs.theme=$('#theme').value=xhs.theme||'editorial-red';$('#xhsCopy').innerHTML=`<h2>标题与发布文案</h2><h3 class="editable" data-xhs-title contenteditable="true">${esc((xhs.title_options||[])[0]||'')}</h3><p class="editable" data-xhs-caption contenteditable="true">${esc(xhs.caption||'')}</p>`;$('#cards').innerHTML=(xhs.cards||[]).map((card,index)=>`<div class="card-wrap"><article class="xhs-card theme-${esc(xhs.theme)}" data-card-index="${index}" data-number="${String(index+1).padStart(2,'0')}">${card.image?`<img class="cover-art" src="${esc(card.image)}" alt=""><span class="cover-shade"></span>`:''}<div><div class="eyebrow editable" contenteditable="true" data-card-field="eyebrow">${esc(card.eyebrow||'PODCAST NOTES')}</div><h2 class="editable" contenteditable="true" data-card-field="title">${esc(card.title||'新卡片')}</h2><div class="body editable" contenteditable="true" data-card-field="body">${esc(card.body||'')}</div></div><footer><span>${esc(source.creator||'PennyScribe')}</span><span>${index+1} / ${xhs.cards.length}</span></footer></article><div class="card-tools"><button onclick="moveCard(${index},-1)">←</button><button onclick="moveCard(${index},1)">→</button><button onclick="duplicateCard(${index})">复制</button><button onclick="deleteCard(${index})">删除</button></div></div>`).join('')||'<div class="empty">点击“新增卡片”开始编辑</div>'}
function sync(){const first=(selector)=>document.querySelector(selector)?.innerText.trim();if(first('[data-readable-title]'))readable.title=first('[data-readable-title]');if(first('[data-reader-title]'))readable.title=first('[data-reader-title]');if(document.querySelector('[data-reader-dek]'))readable.dek=first('[data-reader-dek]');if(document.querySelector('[data-recommendation]'))digest.recommendation=first('[data-recommendation]');if(document.querySelector('[data-summary]'))digest.summary=first('[data-summary]');document.querySelectorAll('[data-insight]').forEach(el=>digest.insights[+el.dataset.insight].text=el.innerText.trim());document.querySelectorAll('[data-quote]').forEach(el=>digest.quotes[+el.dataset.quote].text=el.innerText.trim());document.querySelectorAll('[data-section-heading]').forEach(el=>readable.sections[+el.dataset.sectionHeading].heading=el.innerText.trim());document.querySelectorAll('.transcript-paragraph').forEach(el=>{for(const section of readable.sections||[]){const p=(section.paragraphs||[]).find(x=>x.id===el.dataset.paragraphId);if(p)p.text=el.innerText.trim()}});document.querySelectorAll('[data-x-post]').forEach(el=>x.single_posts[+el.dataset.xPost].text=el.innerText.trim());document.querySelectorAll('[data-thread]').forEach(el=>x.threads[+el.dataset.thread][+el.dataset.threadItem].text=el.innerText.trim());if(document.querySelector('[data-xhs-title]')){xhs.title_options=xhs.title_options||[];xhs.title_options[0]=first('[data-xhs-title]')}if(document.querySelector('[data-xhs-caption]'))xhs.caption=first('[data-xhs-caption]');document.querySelectorAll('.xhs-card').forEach(el=>el.querySelectorAll('[data-card-field]').forEach(field=>xhs.cards[+el.dataset.cardIndex][field.dataset.cardField]=field.innerText.trim()))}
window.moveCard=(i,d)=>{sync();const j=i+d;if(j<0||j>=xhs.cards.length)return;[xhs.cards[i],xhs.cards[j]]=[xhs.cards[j],xhs.cards[i]];renderCards()};window.duplicateCard=i=>{sync();xhs.cards.splice(i+1,0,JSON.parse(JSON.stringify(xhs.cards[i])));renderCards()};window.deleteCard=i=>{sync();xhs.cards.splice(i,1);renderCards()};
$('#theme').onchange=e=>{sync();xhs.theme=e.target.value;renderCards()};$('#addCard').onclick=()=>{sync();xhs.cards.push({kind:'insight',eyebrow:'PODCAST NOTES',title:'新卡片',body:'',source_paragraph_ids:[]});renderCards()};$('#copyCaption').onclick=()=>{sync();navigator.clipboard.writeText(`${(xhs.title_options||[])[0]||''}\n\n${xhs.caption||''}\n\n${source.url||''}`);toast('已复制小红书文案')};
$('#saveJson').onclick=()=>{sync();const blob=new Blob([JSON.stringify(state,null,2)+'\n'],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='project.edited.json';a.click();URL.revokeObjectURL(a.href);toast('已导出项目 JSON')};
renderDigest();renderReader();renderX();renderCards();
</script>
</body>
</html>
