<script>
const state=JSON.parse(document.getElementById('project-data').textContent);
const $=selector=>document.querySelector(selector);
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const source=state.source||{},transcript=state.transcript||{},readable=transcript.readable||{},digest=state.digest||{},x=state.x||{},xhs=state.xiaohongshu||{};
const themeNotes={
  'visual-hand-drawn':'网格纸、便签与手绘线条，友好而有思考感',
  'visual-neo-brutalism':'粗描边、糖果色块与硬投影，张扬但有秩序',
  'visual-paper-cutout':'层叠纸片、柔和投影与手作色彩，温暖亲切',
  'retro-mid-century':'有机几何、芥末黄与橄榄绿，复古而乐观',
  'visual-accessibility':'高对比、大字号与清晰边界，阅读压力最低',
  'visual-comic-book':'漫画分格、半色调与爆炸图形，叙事感强',
  'retro-bauhaus':'三原色、几何构成与严格网格，理性现代',
  'layout-magazine':'衬线标题、编辑网格与单一强调色，内容优先',
  'retro-futurism':'深空、霓虹线框与透视网格，怀旧科幻',
  'core-flat-design':'纯色平面、简单几何与清晰层级，直接高效'
};
const themeAliases={'editorial-red':'layout-magazine','cream-notes':'visual-hand-drawn','neo-brutal':'visual-neo-brutalism','dark-cinema':'retro-futurism','magazine-editorial':'layout-magazine','typography-poster':'visual-comic-book','flat-information':'core-flat-design','fluent-glass':'retro-futurism'};
xhs.theme=themeAliases[xhs.theme]||xhs.theme||'layout-magazine';
let layoutMode=false;
function toast(text){const el=$('#toast');el.textContent=text;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
async function copyText(text){try{await navigator.clipboard.writeText(text)}catch{const area=document.createElement('textarea');area.value=text;area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();document.execCommand('copy');area.remove()}}
document.querySelectorAll('.tabs button').forEach(button=>button.onclick=()=>{document.querySelectorAll('.tabs button').forEach(item=>item.classList.toggle('active',item===button));document.querySelectorAll('.view').forEach(view=>view.classList.toggle('active',view.id===`view-${button.dataset.view}`))});
function switchXhsTab(name){sync();document.querySelectorAll('[data-xhs-tab]').forEach(button=>button.classList.toggle('active',button.dataset.xhsTab===name));document.querySelectorAll('.xhs-pane').forEach(pane=>pane.classList.toggle('active',pane.id===`xhs-pane-${name}`))}document.querySelectorAll('[data-xhs-tab]').forEach(button=>button.onclick=()=>switchXhsTab(button.dataset.xhsTab));
function renderDigest(){const cover=source.cover?`<img src="${esc(source.cover)}" alt="">`:'PS';const insights=(digest.insights||[]).map((item,index)=>`<li class="editable" data-insight="${index}" contenteditable="true">${esc(item.text)}</li>`).join('');$('#digestRoot').innerHTML=`<section class="hero"><div><div class="kicker">${esc(source.platform||'PODCAST')} · READING EDITION</div><h1 class="editable" data-readable-title contenteditable="true">${esc(readable.title||source.title||'Untitled')}</h1><p class="editable" data-recommendation contenteditable="true">${esc(digest.recommendation||readable.dek||'')}</p><div class="meta"><span>${esc(source.creator||'')}</span><span>${esc(source.published_at||'')}</span><a href="${esc(source.url||'#')}" target="_blank" rel="noreferrer">原节目链接 ↗</a></div></div><div class="cover">${cover}</div></section><div class="grid"><section class="panel"><h2>本期摘要</h2><p class="editable" data-summary contenteditable="true">${esc(digest.summary||'')}</p><h3>核心观点</h3><ul>${insights||'<li>尚未生成</li>'}</ul></section><section class="panel"><h2>阅读建议</h2><p>${esc(digest.recommendation||'')}</p><h3>适合谁</h3>${(digest.audience||[]).map(value=>`<span class="pill">${esc(value)}</span>`).join('')}</section></div>`}
function renderQuotes(){const quotes=digest.quotes||[];$('#quotesRoot').innerHTML=`<div class="kicker">QUOTABLE MOMENTS</div><h1>金句列表</h1><p>点击文字即可编辑，复制后可直接用于社交媒体或文章引语。</p><button class="button" id="copyAllQuotes">复制全部金句</button><div class="quote-grid">${quotes.map((quote,index)=>`<article class="quote-item"><blockquote class="editable" data-quote="${index}" contenteditable="true">${esc(quote.text)}</blockquote><div class="quote-meta"><span>${esc(quote.fidelity||'')}</span><button class="button small" onclick="copyQuote(${index})">复制</button></div></article>`).join('')||'<div class="empty">尚未生成金句</div>'}</div>`;$('#copyAllQuotes').onclick=()=>{sync();copyText((digest.quotes||[]).map((quote,index)=>`${index+1}. ${quote.text}`).join('\n\n'));toast('已复制全部金句')}}
window.copyQuote=index=>{sync();copyText((digest.quotes[index]||{}).text||'');toast('已复制金句')};
function renderReader(){const sections=readable.sections||[];$('#toc').innerHTML=`<div class="kicker">CONTENTS</div>${sections.map(section=>`<a href="#${esc(section.id)}">${esc(section.heading)}</a>`).join('')}`;$('#readerRoot').innerHTML=`<div class="kicker">FULL TRANSCRIPT</div><h1 class="editable" data-reader-title contenteditable="true">${esc(readable.title||source.title||'阅读全文')}</h1><p class="dek editable" data-reader-dek contenteditable="true">${esc(readable.dek||'')}</p>${sections.map((section,index)=>`<section id="${esc(section.id)}"><h2 class="editable" data-section-heading="${index}" contenteditable="true">${esc(section.heading)}</h2>${(section.paragraphs||[]).map(paragraph=>`<p class="editable transcript-paragraph" data-paragraph-id="${esc(paragraph.id)}" contenteditable="true">${esc(paragraph.text)}</p>`).join('')}</section>`).join('')}<div class="source-toggle"><button class="button" id="toggleRaw">显示 / 隐藏原始转写</button><button class="button" id="copyMarkdown">复制全文 Markdown</button></div><div class="raw" id="raw">${esc(transcript.raw||'')}</div>`;$('#toggleRaw').onclick=()=>$('#raw').classList.toggle('show');$('#copyMarkdown').onclick=()=>{sync();const markdown=sections.map(section=>`## ${section.heading}\n\n${(section.paragraphs||[]).map(paragraph=>paragraph.text).join('\n\n')}`).join('\n\n');copyText(`# ${readable.title||source.title}\n\n${markdown}`);toast('已复制 Markdown')}}
function renderX(){const posts=(x.single_posts||[]).map((post,index)=>`<div class="post"><div class="editable" data-x-post="${index}" contenteditable="true">${esc(post.text)}</div><div class="post-tools"><button class="button small" onclick="copyXPost(${index})">复制</button></div></div>`).join('');const threads=(x.threads||[]).map((thread,threadIndex)=>`<section class="panel"><h2>Thread ${threadIndex+1}</h2>${thread.map((post,index)=>`<div class="post thread-item editable" data-index="${index+1}" data-thread="${threadIndex}" data-thread-item="${index}" contenteditable="true">${esc(post.text)}</div>`).join('')}<button class="button" onclick="copyThread(${threadIndex})">复制 Thread</button></section>`).join('');$('#xRoot').innerHTML=`<div class="kicker">X PUBLISHING</div><h1>独立文案</h1><div class="social-layout"><section><h2>Single posts</h2>${posts||'<div class="empty">尚未生成 X 文案</div>'}</section><section>${threads||'<div class="empty">尚未生成 Thread</div>'}</section></div>`}
window.copyXPost=index=>{sync();copyText((x.single_posts[index]||{}).text||'');toast('已复制 X 文案')};window.copyThread=index=>{sync();copyText((x.threads[index]||[]).map(post=>post.text).join('\n\n'));toast('已复制 Thread')};
function cardClass(card){return card.kind==='cover'?'card-cover':'card-content'}
function headlineClass(title){return String(title||'').replace(/\s/g,'').length<=10?' headline-compact':''}
function layoutHandle(label){return `<button type="button" class="layout-handle" contenteditable="false" aria-label="拖动${label}" title="拖动${label}；方向键微调"></button>`}
function cardParagraphs(body,draggable=true){return String(body||'').split(/\n\s*\n/).filter(Boolean).map((paragraph,index)=>`<p${draggable?` class="layout-block" data-layout-key="body-${index}"`:''}>${esc(paragraph)}${draggable?layoutHandle(`第 ${index+1} 段`):''}</p>`).join('')}
function layoutOffset(card,key){const value=(card.layout||{})[key]||{};return{x:Number(value.x)||0,y:Number(value.y)||0}}
function applyLayoutOffset(article,key,offset){if(key==='before'||key==='after'){article.style.setProperty(`--layout-${key}-x`,`${offset.x}px`);article.style.setProperty(`--layout-${key}-y`,`${offset.y}px`);return}const block=article.querySelector(`[data-layout-key="${key}"]`);if(block){block.style.setProperty('--layout-x',`${offset.x}px`);block.style.setProperty('--layout-y',`${offset.y}px`)}}
function applyCardLayout(article,index){const card=xhs.cards[index]||{};for(const [key,offset] of Object.entries(card.layout||{}))applyLayoutOffset(article,key,offset)}
function pseudoBox(article,name){const style=getComputedStyle(article,`::${name}`),fontSize=parseFloat(style.fontSize)||0;let width=parseFloat(style.width),height=parseFloat(style.height);if(!Number.isFinite(width)&&style.content&&style.content!=='none')width=fontSize*1.35;if(!Number.isFinite(height)&&style.content&&style.content!=='none')height=parseFloat(style.lineHeight)||fontSize*1.2;if(!Number.isFinite(width)||!Number.isFinite(height)||width<8||height<8||width>280||height>280)return null;const leftValue=parseFloat(style.left),rightValue=parseFloat(style.right),topValue=parseFloat(style.top),bottomValue=parseFloat(style.bottom);const left=Number.isFinite(leftValue)?leftValue:article.clientWidth-rightValue-width;const top=Number.isFinite(topValue)?topValue:article.clientHeight-bottomValue-height;if(!Number.isFinite(left)||!Number.isFinite(top))return null;return{left,top,width,height}}
function updateDecorationGuides(){if(!layoutMode)return;document.querySelectorAll('.xhs-card').forEach(article=>['before','after'].forEach(name=>{const guide=article.querySelector(`[data-decoration-key="${name}"]`),box=pseudoBox(article,name);if(!guide)return;if(!box){guide.hidden=true;return}const offset=layoutOffset(xhs.cards[+article.dataset.cardIndex]||{},name);guide.hidden=false;guide.style.left=`${box.left+offset.x}px`;guide.style.top=`${box.top+offset.y}px`;guide.style.width=`${Math.max(28,box.width)}px`;guide.style.height=`${Math.max(28,box.height)}px`}))}
function writeLayoutOffset(index,key,x,y){const card=xhs.cards[index];card.layout=card.layout||{};card.layout[key]={x:Math.round(Math.max(-540,Math.min(540,x))),y:Math.round(Math.max(-720,Math.min(720,y)))};const article=document.querySelector(`.xhs-card[data-card-index="${index}"]`);if(article){applyLayoutOffset(article,key,card.layout[key]);if(key==='before'||key==='after')updateDecorationGuides()}}
function bindLayoutInteractions(){document.querySelectorAll('.xhs-card').forEach(article=>{const index=+article.dataset.cardIndex;applyCardLayout(article,index);article.querySelectorAll('.layout-handle,.decoration-guide').forEach(handle=>{const key=handle.dataset.decorationKey||handle.closest('[data-layout-key]')?.dataset.layoutKey;if(!key)return;handle.onpointerdown=event=>{if(!layoutMode)return;event.preventDefault();event.stopPropagation();handle.setPointerCapture(event.pointerId);const start=layoutOffset(xhs.cards[index]||{},key),origin={x:event.clientX,y:event.clientY},scale=article.getBoundingClientRect().width/article.offsetWidth||1;handle.onpointermove=move=>{if(!handle.hasPointerCapture(move.pointerId))return;writeLayoutOffset(index,key,start.x+(move.clientX-origin.x)/scale,start.y+(move.clientY-origin.y)/scale)};handle.onpointerup=move=>{if(handle.hasPointerCapture(move.pointerId))handle.releasePointerCapture(move.pointerId);handle.onpointermove=null;toast('排版位置已更新')};handle.onpointercancel=handle.onpointerup};handle.onkeydown=event=>{const steps={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};if(!steps[event.key])return;event.preventDefault();const offset=layoutOffset(xhs.cards[index]||{},key),step=event.shiftKey?10:2;writeLayoutOffset(index,key,offset.x+steps[event.key][0]*step,offset.y+steps[event.key][1]*step)}})});requestAnimationFrame(updateDecorationGuides)}
function setLayoutMode(enabled){layoutMode=enabled;$('#cards').classList.toggle('layout-mode',enabled);$('#xhsToolbar').classList.toggle('layout-active',enabled);$('#layoutMode').setAttribute('aria-pressed',String(enabled));$('#layoutMode').textContent=enabled?'完成排版':'自由排版';if(enabled)requestAnimationFrame(updateDecorationGuides)}
function renderCards(){xhs.theme=$('#theme').value=xhs.theme||'magazine-editorial';$('#themeNote').textContent=themeNotes[xhs.theme]||'';const options=xhs.title_options||[];$('#xhsCopy').innerHTML=`<h2>标题与发布文案</h2><p class="kicker">PRIMARY TITLE</p><h3 class="editable" data-xhs-title contenteditable="true">${esc(options[0]||'')}</h3>${options.length>1?`<div class="title-options">${options.slice(1).map(title=>`<span class="title-chip">${esc(title)}</span>`).join('')}</div>`:''}<p class="editable xhs-copy" data-xhs-caption contenteditable="true">${esc(xhs.caption||'')}</p>`;$('#cards').innerHTML=(xhs.cards||[]).map((card,index)=>{const cover=card.kind==='cover';return `<div class="card-wrap"><article class="xhs-card ${cardClass(card)} theme-${esc(xhs.theme)}" data-card-index="${index}" data-number="${String(index+1).padStart(2,'0')}">${card.image?`<img class="cover-art" src="${esc(card.image)}" alt=""><span class="cover-shade"></span>`:''}<div><div class="eyebrow editable layout-block" contenteditable="true" data-card-field="eyebrow" data-layout-key="eyebrow">${esc(card.eyebrow||'')}${layoutHandle('眉题')}</div><h2 class="editable layout-block${headlineClass(card.title)}" contenteditable="true" data-card-field="title" data-layout-key="title">${esc(card.title||'新卡片')}${layoutHandle('主标题')}</h2><div class="body editable${cover?' layout-block':''}" contenteditable="true" data-card-field="body"${cover?' data-layout-key="body"':''}>${cardParagraphs(card.body,!cover)}${cover?layoutHandle('正文'):''}</div></div><footer class="layout-block" data-layout-key="footer"><span>${String(index+1).padStart(2,'0')} / ${String(xhs.cards.length).padStart(2,'0')}</span>${layoutHandle('页码')}</footer><button type="button" class="decoration-guide" data-decoration-key="before" aria-label="拖动装饰一"></button><button type="button" class="decoration-guide" data-decoration-key="after" aria-label="拖动装饰二"></button></article><div class="card-tools"><button onclick="moveCard(${index},-1)">←</button><button onclick="moveCard(${index},1)">→</button><button onclick="copyCard(${index})">复制文字</button><button onclick="exportCard(${index})">导出 PNG</button><button onclick="duplicateCard(${index})">复制卡片</button><button onclick="deleteCard(${index})">删除</button></div></div>`}).join('')||'<div class="empty">点击“新增卡片”开始编辑</div>';$('#cards').classList.toggle('layout-mode',layoutMode);bindLayoutInteractions()}
function sync(){const first=selector=>document.querySelector(selector)?.innerText.trim();if(first('[data-readable-title]'))readable.title=first('[data-readable-title]');if(first('[data-reader-title]'))readable.title=first('[data-reader-title]');if(document.querySelector('[data-reader-dek]'))readable.dek=first('[data-reader-dek]');if(document.querySelector('[data-recommendation]'))digest.recommendation=first('[data-recommendation]');if(document.querySelector('[data-summary]'))digest.summary=first('[data-summary]');document.querySelectorAll('[data-insight]').forEach(element=>digest.insights[+element.dataset.insight].text=element.innerText.trim());document.querySelectorAll('[data-quote]').forEach(element=>digest.quotes[+element.dataset.quote].text=element.innerText.trim());document.querySelectorAll('[data-section-heading]').forEach(element=>readable.sections[+element.dataset.sectionHeading].heading=element.innerText.trim());document.querySelectorAll('.transcript-paragraph').forEach(element=>{for(const section of readable.sections||[]){const paragraph=(section.paragraphs||[]).find(item=>item.id===element.dataset.paragraphId);if(paragraph)paragraph.text=element.innerText.trim()}});document.querySelectorAll('[data-x-post]').forEach(element=>x.single_posts[+element.dataset.xPost].text=element.innerText.trim());document.querySelectorAll('[data-thread]').forEach(element=>x.threads[+element.dataset.thread][+element.dataset.threadItem].text=element.innerText.trim());if(document.querySelector('[data-xhs-title]')){xhs.title_options=xhs.title_options||[];xhs.title_options[0]=first('[data-xhs-title]')}if(document.querySelector('[data-xhs-caption]'))xhs.caption=first('[data-xhs-caption]');document.querySelectorAll('.xhs-card').forEach(element=>element.querySelectorAll('[data-card-field]').forEach(field=>{const value=field.dataset.cardField==='body'?[...field.querySelectorAll('p')].map(paragraph=>paragraph.innerText.trim()).filter(Boolean).join('\n\n'):field.innerText.trim();xhs.cards[+element.dataset.cardIndex][field.dataset.cardField]=value}))}
window.moveCard=(index,direction)=>{sync();const target=index+direction;if(target<0||target>=xhs.cards.length)return;[xhs.cards[index],xhs.cards[target]]=[xhs.cards[target],xhs.cards[index]];renderCards()};window.duplicateCard=index=>copyCardImage(index);window.deleteCard=index=>{sync();xhs.cards.splice(index,1);renderCards()};window.copyCard=index=>{sync();const card=xhs.cards[index]||{};copyText([card.eyebrow,card.title,card.body].filter(Boolean).join('\n\n'));toast('已复制卡片文字')};
async function cardPng(index,download=true){sync();const card=document.querySelector(`.xhs-card[data-card-index="${index}"]`);if(!card)return;const clone=card.cloneNode(true);clone.querySelectorAll('[contenteditable]').forEach(element=>element.removeAttribute('contenteditable'));clone.querySelectorAll('.layout-handle,.decoration-guide').forEach(element=>element.remove());clone.querySelectorAll('img').forEach(element=>element.remove());const css=[...document.querySelectorAll('style')].map(style=>style.textContent).join('\n');const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="540" height="720"><foreignObject width="540" height="720"><div xmlns="http://www.w3.org/1999/xhtml"><style>${css}</style>${clone.outerHTML}</div></foreignObject></svg>`;const image=new Image();await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=reject;image.src=`data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`});const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1440;const context=canvas.getContext('2d');context.scale(2,2);context.drawImage(image,0,0,540,720);const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(download){const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=`xiaohongshu-${String(index+1).padStart(2,'0')}.png`;link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000)}return blob}
window.exportCard=async index=>{try{await cardPng(index);toast('已导出 1080 × 1440 PNG')}catch(error){console.error(error);toast('浏览器导出失败，请使用批量导出脚本')}};
async function copyCardImage(index){try{if(!navigator.clipboard?.write||typeof ClipboardItem==='undefined')throw new Error('image clipboard is unavailable');const blob=await cardPng(index,false);await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);toast('卡片图片已复制到剪贴板')}catch(error){console.error(error);toast('复制图片失败，请通过 localhost 预览并授权剪贴板')}}
const crcTable=(()=>{const table=new Uint32Array(256);for(let index=0;index<256;index+=1){let value=index;for(let bit=0;bit<8;bit+=1)value=(value&1)?0xedb88320^(value>>>1):value>>>1;table[index]=value>>>0}return table})();
function crc32(bytes){let value=0xffffffff;for(const byte of bytes)value=crcTable[(value^byte)&255]^(value>>>8);return(value^0xffffffff)>>>0}
function le16(value){return new Uint8Array([value&255,(value>>>8)&255])}function le32(value){return new Uint8Array([value&255,(value>>>8)&255,(value>>>16)&255,(value>>>24)&255])}function joinBytes(parts){const output=new Uint8Array(parts.reduce((sum,part)=>sum+part.length,0));let offset=0;for(const part of parts){output.set(part,offset);offset+=part.length}return output}
async function zipFiles(files){const encoder=new TextEncoder(),locals=[],centrals=[];let offset=0,centralSize=0;const now=new Date(),dosTime=(now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1),dosDate=((Math.max(1980,now.getFullYear())-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate();for(const file of files){const name=encoder.encode(file.name),data=new Uint8Array(await file.blob.arrayBuffer()),checksum=crc32(data),size=data.length;const local=joinBytes([le32(0x04034b50),le16(20),le16(0x0800),le16(0),le16(dosTime),le16(dosDate),le32(checksum),le32(size),le32(size),le16(name.length),le16(0),name,data]);const central=joinBytes([le32(0x02014b50),le16(20),le16(20),le16(0x0800),le16(0),le16(dosTime),le16(dosDate),le32(checksum),le32(size),le32(size),le16(name.length),le16(0),le16(0),le16(0),le16(0),le32(0),le32(offset),name]);locals.push(local);centrals.push(central);offset+=local.length;centralSize+=central.length}const end=joinBytes([le32(0x06054b50),le16(0),le16(0),le16(files.length),le16(files.length),le32(centralSize),le32(offset),le16(0)]);return new Blob([...locals,...centrals,end],{type:'application/zip'})}
function downloadBlob(blob,name){const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000)}
$('#theme').onchange=event=>{sync();xhs.theme=event.target.value;renderCards()};$('#layoutMode').onclick=()=>setLayoutMode(!layoutMode);$('#resetLayout').onclick=()=>{sync();(xhs.cards||[]).forEach(card=>delete card.layout);renderCards();toast('已重置全部卡片排版')};$('#addCard').onclick=()=>{sync();xhs.cards.push({kind:'insight',eyebrow:'KEY IDEA',title:'新卡片',body:'',source_paragraph_ids:[],layout:{}});renderCards()};$('#copyCaption').onclick=()=>{sync();copyText(`${(xhs.title_options||[])[0]||''}\n\n${xhs.caption||''}`.trim());toast('已复制无链接发布文案')};$('#exportAllCards').onclick=async()=>{const button=$('#exportAllCards'),label=button.textContent;button.disabled=true;button.textContent='正在打包…';try{const files=[];for(let index=0;index<(xhs.cards||[]).length;index+=1){toast(`正在生成 ${index+1} / ${xhs.cards.length}`);files.push({name:`xiaohongshu-${String(index+1).padStart(2,'0')}.png`,blob:await cardPng(index,false)})}const archive=await zipFiles(files);downloadBlob(archive,`xiaohongshu-cards-${xhs.theme}.zip`);toast(`已打包 ${files.length} 张卡片`)}catch(error){console.error(error);toast('ZIP 打包失败')}finally{button.disabled=false;button.textContent=label}};document.addEventListener('input',event=>{const heading=event.target.closest?.('[data-card-field="title"]');if(heading)heading.classList.toggle('headline-compact',headlineClass(heading.innerText).trim()==='headline-compact')});window.addEventListener('resize',()=>requestAnimationFrame(updateDecorationGuides));
$('#saveJson').onclick=()=>{sync();const blob=new Blob([JSON.stringify(state,null,2)+'\n'],{type:'application/json'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='project.edited.json';link.click();URL.revokeObjectURL(link.href);toast('已导出项目 JSON')};
renderDigest();renderQuotes();renderReader();renderX();renderCards();
