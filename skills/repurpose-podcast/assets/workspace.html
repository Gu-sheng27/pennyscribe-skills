<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PennyScribe · Podcast Studio</title>
<style>
:root{--ink:#16191d;--muted:#6e716f;--paper:#eeeae1;--panel:#fffdf8;--accent:#e23b2f;--accent-dark:#9f211b;--line:#d8d2c7;--shadow:0 24px 70px rgba(42,35,27,.12)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:var(--paper);font-family:Inter,"PingFang SC","Noto Sans CJK SC",system-ui,sans-serif}.shell{min-height:100vh}.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:22px;padding:13px 26px;background:rgba(238,234,225,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.brand{font-family:Georgia,serif;font-weight:800;font-size:20px;white-space:nowrap}.brand b{color:var(--accent)}.tabs{display:flex;gap:6px;overflow:auto}.tabs button,.button,select{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:9px 14px;font:inherit;cursor:pointer}.tabs button.active{background:var(--ink);color:#fff;border-color:var(--ink)}.actions{margin-left:auto;display:flex;gap:8px}.button.primary{background:var(--accent);border-color:var(--accent);color:#fff}.button.small{padding:7px 10px;font-size:13px}.view{display:none}.view.active{display:block}.page{width:min(1160px,calc(100% - 36px));margin:42px auto 90px}.kicker{text-transform:uppercase;letter-spacing:.18em;color:var(--accent);font-size:12px;font-weight:900}.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,.7fr);gap:42px;align-items:end;padding:44px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow)}.hero h1{font:750 clamp(38px,6vw,76px)/.98 Georgia,"Songti SC",serif;margin:14px 0 22px}.hero p{font-size:18px;line-height:1.8;color:#4c4944}.cover{aspect-ratio:1;border-radius:4px;background:linear-gradient(145deg,#241f1b,#6a211f);overflow:hidden;display:grid;place-items:center;color:#fff;font:700 40px Georgia}.cover img{width:100%;height:100%;object-fit:cover}.meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:24px}.meta a{color:inherit}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:22px}.panel{padding:28px;border:1px solid var(--line);background:var(--panel)}.panel h2,.panel h3{font-family:Georgia,"Songti SC",serif;margin-top:0}.bigquote{font:italic 25px/1.55 Georgia,"Songti SC",serif;border-left:4px solid var(--accent);padding-left:24px}.pill{display:inline-block;padding:7px 10px;border-radius:999px;background:#ede7da;margin:4px;font-size:13px}.editable{outline:none;border-radius:3px}.editable:focus{background:#fff0b8;box-shadow:0 0 0 5px #fff0b8}.reader-layout{display:grid;grid-template-columns:230px minmax(0,720px);gap:52px;justify-content:center}.toc{position:sticky;top:86px;align-self:start;max-height:calc(100vh - 110px);overflow:auto}.toc a{display:block;padding:8px 0;color:var(--muted);text-decoration:none}.toc a:hover{color:var(--accent)}.reader{background:var(--panel);padding:64px 72px;box-shadow:var(--shadow)}.reader h1{font:700 48px/1.08 Georgia,"Songti SC",serif}.reader .dek{font-size:19px;color:var(--muted);line-height:1.75}.reader section{padding-top:28px}.reader h2{font:700 30px/1.25 Georgia,"Songti SC",serif}.reader p{font:18px/2 Georgia,"Songti SC",serif;letter-spacing:.015em}.source-toggle{display:flex;gap:8px;margin-top:40px}.raw{display:none;padding:24px;white-space:pre-wrap;background:#efebe2;color:#5d5851;line-height:1.7}.raw.show{display:block}.social-layout{display:grid;grid-template-columns:1fr 1fr;gap:26px}.post{position:relative;padding:26px;margin-bottom:16px;border:1px solid var(--line);background:var(--panel);font-size:18px;line-height:1.65;white-space:pre-wrap}.post-tools{display:flex;justify-content:flex-end;margin-top:10px}.thread-item{padding-left:58px}.thread-item:before{content:attr(data-index);position:absolute;left:18px;top:24px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:#fff;font-size:12px}.quote-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:28px}.quote-item{min-height:250px;padding:28px;display:flex;flex-direction:column;justify-content:space-between;background:var(--panel);border:1px solid var(--line)}.quote-item blockquote{margin:0;font:600 25px/1.55 Georgia,"Songti SC",serif}.quote-item .quote-meta{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px}.xhs-toolbar{position:sticky;top:68px;z-index:10;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:24px;padding:12px;background:rgba(238,234,225,.94);backdrop-filter:blur(12px);border:1px solid var(--line)}.theme-note{font-size:13px;color:var(--muted);margin-right:auto}.xhs-copy{white-space:pre-wrap}.title-options{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 22px}.title-chip{padding:9px 12px;border:1px solid var(--line);border-radius:999px;background:#f7f3eb;font-size:14px}.cards{display:flex;flex-wrap:wrap;align-items:flex-start;gap:28px}.card-wrap{position:relative}.card-tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.card-tools button{border:1px solid var(--line);background:var(--panel);padding:7px 10px;border-radius:8px;cursor:pointer}.xhs-card{--card-bg:#f8f0df;--card-ink:#17191b;--card-accent:#da3328;width:540px;height:720px;padding:54px 50px;overflow:hidden;position:relative;display:flex;flex-direction:column;justify-content:space-between;background:var(--card-bg);color:var(--card-ink);box-shadow:var(--shadow);isolation:isolate}.xhs-card:before,.xhs-card:after{content:"";position:absolute;pointer-events:none}.xhs-card .eyebrow{position:relative;z-index:2;font-size:13px;letter-spacing:.2em;text-transform:uppercase;font-weight:900}.xhs-card h2{position:relative;z-index:2;font:850 46px/1.08 "PingFang SC","Noto Sans CJK SC",sans-serif;letter-spacing:-.045em;margin:24px 0}.xhs-card .body{position:relative;z-index:2;font-size:22px;line-height:1.58;white-space:pre-wrap}.xhs-card footer{position:relative;z-index:2;display:flex;justify-content:flex-end;align-items:end;font:800 14px Georgia;letter-spacing:.13em}.xhs-card .cover-art{position:absolute;inset:0;z-index:-3;width:100%;height:100%;object-fit:cover;filter:saturate(.7) contrast(1.05)}.xhs-card .cover-shade{position:absolute;inset:0;z-index:-2;background:linear-gradient(180deg,rgba(9,12,14,.12),rgba(9,12,14,.92))}.card-content:before{left:0;top:0;width:100%;height:11px;background:var(--card-accent)}.card-content:after{right:50px;top:50px;width:54px;height:54px;border-top:2px solid var(--card-accent);border-right:2px solid var(--card-accent)}.card-content h2{color:var(--card-accent)}.card-cover{padding:58px 50px;background:#15191d;color:#fff}.card-cover:before{right:-125px;top:-105px;width:350px;height:350px;border:54px solid var(--card-accent);border-radius:50%;opacity:.95}.card-cover:after{left:50px;right:50px;bottom:120px;height:1px;background:rgba(255,255,255,.36)}.card-cover .eyebrow{display:inline-flex;width:max-content;padding:8px 11px;background:var(--card-accent);color:#fff}.card-cover h2{max-width:450px;margin-top:90px;color:#fff;font-size:62px;line-height:1.02;letter-spacing:-.06em}.card-cover .body{max-width:410px;font-size:24px;line-height:1.5;color:rgba(255,255,255,.88)}.theme-editorial-red{--card-bg:#f6efdf;--card-ink:#17191b;--card-accent:#d9362b}.theme-editorial-red.card-cover{background:#171a1e}.theme-cream-notes{--card-bg:#f7efdc;--card-ink:#25313b;--card-accent:#c14c3c}.theme-cream-notes.card-cover{background:#e7d6b5;color:#25313b;border:16px solid #25313b}.theme-cream-notes.card-cover h2,.theme-cream-notes.card-cover .body{color:#25313b}.theme-cream-notes.card-cover:after{background:rgba(37,49,59,.35)}.theme-neo-brutal{--card-bg:#ffe94d;--card-ink:#111;--card-accent:#111;border:5px solid #111;box-shadow:11px 11px 0 #111}.theme-neo-brutal.card-cover{background:#ff4d37}.theme-neo-brutal .eyebrow{background:#111;color:#fff;width:max-content;padding:8px}.theme-dark-cinema{--card-bg:#171717;--card-ink:#f7f0e4;--card-accent:#d1a45f}.theme-dark-cinema.card-cover{background:#0d0e10}.theme-dark-cinema h2{font-family:Georgia,"Songti SC",serif}.theme-dark-cinema.card-content .body{color:#ded6c8}.empty{color:var(--muted);padding:32px;border:1px dashed var(--line);background:var(--panel)}.toast{position:fixed;right:22px;bottom:22px;background:#171614;color:#fff;padding:12px 16px;border-radius:10px;opacity:0;transform:translateY(8px);transition:.2s;z-index:50}.toast.show{opacity:1;transform:none}
.card-cover:before{right:24px;top:24px;width:220px;height:220px;border-width:42px}.card-cover h2{margin-top:82px;font-size:60px}.card-content .body{font-size:20.5px;line-height:1.56}.xhs-subtabs{display:inline-flex;gap:5px;padding:5px;margin-bottom:22px;border:1px solid var(--line);border-radius:14px;background:rgba(255,253,248,.7)}.xhs-subtabs button{border:0;border-radius:10px;padding:10px 18px;background:transparent;color:var(--muted);font:inherit;font-weight:700;cursor:pointer}.xhs-subtabs button.active{background:var(--ink);color:#fff}.xhs-pane{display:none}.xhs-pane.active{display:block}.xhs-copy-actions{display:flex;justify-content:flex-end;margin-top:20px}
@media(max-width:860px){.topbar{flex-wrap:wrap;padding:12px}.actions{margin-left:0}.page{width:min(100% - 20px,720px);margin-top:20px}.hero,.grid,.social-layout,.quote-grid{grid-template-columns:1fr}.hero{padding:28px}.reader-layout{display:block}.toc{position:relative;top:auto;margin-bottom:20px}.reader{padding:34px 25px}.cards{justify-content:center}.card-wrap{max-width:100%;overflow:auto}.xhs-toolbar{top:116px}.xhs-card{transform-origin:top left}}
@media print{.topbar,.toc,.source-toggle,.raw,.card-tools,.xhs-toolbar{display:none!important}.view{display:none!important}.view.active{display:block!important}.page{width:100%;margin:0}.reader{box-shadow:none;padding:0}.reader p{font-size:12pt}}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">Penny<b>Scribe</b> Studio</div>
    <nav class="tabs">
      <button class="active" data-view="digest">导读与摘要</button>
      <button data-view="quotes">金句</button>
      <button data-view="reader">阅读全文</button>
      <button data-view="x">X 素材</button>
      <button data-view="xhs">小红书素材</button>
    </nav>
    <div class="actions"><button class="button" id="saveJson">导出项目 JSON</button><button class="button primary" onclick="window.print()">打印 / PDF</button></div>
  </header>
  <main>
    <div class="view active" id="view-digest"><div class="page" id="digestRoot"></div></div>
    <div class="view" id="view-quotes"><div class="page" id="quotesRoot"></div></div>
    <div class="view" id="view-reader"><div class="page reader-layout"><aside class="toc" id="toc"></aside><article class="reader" id="readerRoot"></article></div></div>
    <div class="view" id="view-x"><div class="page" id="xRoot"></div></div>
    <div class="view" id="view-xhs"><div class="page"><nav class="xhs-subtabs" aria-label="小红书素材视图"><button class="active" data-xhs-tab="copy">标题与文案</button><button data-xhs-tab="cards">卡片编辑</button></nav><section class="xhs-pane active" id="xhs-pane-copy"><section class="panel" id="xhsCopy"></section><div class="xhs-copy-actions"><button class="button primary" id="copyCaption">复制发布文案</button></div></section><section class="xhs-pane" id="xhs-pane-cards"><div class="xhs-toolbar"><label>排版风格 <select id="theme"><option value="editorial-red">编辑红</option><option value="cream-notes">奶油手记</option><option value="neo-brutal">新粗野</option><option value="dark-cinema">暗色电影</option></select></label><span class="theme-note" id="themeNote"></span><button class="button small" id="addCard">新增卡片</button><button class="button primary small" id="exportAllCards">导出全部卡片</button></div><div class="cards" id="cards"></div></section></div></div>
  </main>
</div>
<div class="toast" id="toast"></div>
<script id="project-data" type="application/json">__PROJECT_DATA__</script>
<script>
const state=JSON.parse(document.getElementById('project-data').textContent);
const $=selector=>document.querySelector(selector);
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const source=state.source||{},transcript=state.transcript||{},readable=transcript.readable||{},digest=state.digest||{},x=state.x||{},xhs=state.xiaohongshu||{};
const themeNotes={
  'editorial-red':'高对比编辑感，适合商业、科技与人物访谈',
  'cream-notes':'温和纸张感，适合生活、文化与个人成长',
  'neo-brutal':'强识别度与硬朗色块，适合观点型内容',
  'dark-cinema':'深色克制，适合深度访谈与人物故事'
};
function toast(text){const el=$('#toast');el.textContent=text;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
async function copyText(text){try{await navigator.clipboard.writeText(text)}catch{const area=document.createElement('textarea');area.value=text;area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();document.execCommand('copy');area.remove()}}
document.querySelectorAll('.tabs button').forEach(button=>button.onclick=()=>{document.querySelectorAll('.tabs button').forEach(item=>item.classList.toggle('active',item===button));document.querySelectorAll('.view').forEach(view=>view.classList.toggle('active',view.id===`view-${button.dataset.view}`))});
function switchXhsTab(name){sync();document.querySelectorAll('[data-xhs-tab]').forEach(button=>button.classList.toggle('active',button.dataset.xhsTab===name));document.querySelectorAll('.xhs-pane').forEach(pane=>pane.classList.toggle('active',pane.id===`xhs-pane-${name}`))}document.querySelectorAll('[data-xhs-tab]').forEach(button=>button.onclick=()=>switchXhsTab(button.dataset.xhsTab));
function renderDigest(){const cover=source.cover?`<img src="${esc(source.cover)}" alt="">`:'PS';const insights=(digest.insights||[]).map((item,index)=>`<li class="editable" data-insight="${index}" contenteditable="true">${esc(item.text)}</li>`).join('');$('#digestRoot').innerHTML=`<section class="hero"><div><div class="kicker">${esc(source.platform||'PODCAST')} · READING EDITION</div><h1 class="editable" data-readable-title contenteditable="true">${esc(readable.title||source.title||'Untitled')}</h1><p class="editable" data-recommendation contenteditable="true">${esc(digest.recommendation||readable.dek||'')}</p><div class="meta"><span>${esc(source.creator||'')}</span><span>${esc(source.published_at||'')}</span><a href="${esc(source.url||'#')}" target="_blank" rel="noreferrer">原节目链接 ↗</a></div></div><div class="cover">${cover}</div></section><div class="grid"><section class="panel"><h2>本期摘要</h2><p class="editable" data-summary contenteditable="true">${esc(digest.summary||'')}</p><h3>核心观点</h3><ul>${insights||'<li>尚未生成</li>'}</ul></section><section class="panel"><h2>阅读建议</h2><p>${esc(digest.recommendation||'')}</p><h3>适合谁</h3>${(digest.audience||[]).map(value=>`<span class="pill">${esc(value)}</span>`).join('')}</section></div>`}
function renderQuotes(){const quotes=digest.quotes||[];$('#quotesRoot').innerHTML=`<div class="kicker">QUOTABLE MOMENTS</div><h1>金句列表</h1><p>点击文字即可编辑，复制后可直接用于社交媒体或文章引语。</p><button class="button" id="copyAllQuotes">复制全部金句</button><div class="quote-grid">${quotes.map((quote,index)=>`<article class="quote-item"><blockquote class="editable" data-quote="${index}" contenteditable="true">${esc(quote.text)}</blockquote><div class="quote-meta"><span>${esc(quote.fidelity||'')}</span><button class="button small" onclick="copyQuote(${index})">复制</button></div></article>`).join('')||'<div class="empty">尚未生成金句</div>'}</div>`;$('#copyAllQuotes').onclick=()=>{sync();copyText((digest.quotes||[]).map((quote,index)=>`${index+1}. ${quote.text}`).join('\n\n'));toast('已复制全部金句')}}
window.copyQuote=index=>{sync();copyText((digest.quotes[index]||{}).text||'');toast('已复制金句')};
function renderReader(){const sections=readable.sections||[];$('#toc').innerHTML=`<div class="kicker">CONTENTS</div>${sections.map(section=>`<a href="#${esc(section.id)}">${esc(section.heading)}</a>`).join('')}`;$('#readerRoot').innerHTML=`<div class="kicker">FULL TRANSCRIPT</div><h1 class="editable" data-reader-title contenteditable="true">${esc(readable.title||source.title||'阅读全文')}</h1><p class="dek editable" data-reader-dek contenteditable="true">${esc(readable.dek||'')}</p>${sections.map((section,index)=>`<section id="${esc(section.id)}"><h2 class="editable" data-section-heading="${index}" contenteditable="true">${esc(section.heading)}</h2>${(section.paragraphs||[]).map(paragraph=>`<p class="editable transcript-paragraph" data-paragraph-id="${esc(paragraph.id)}" contenteditable="true">${esc(paragraph.text)}</p>`).join('')}</section>`).join('')}<div class="source-toggle"><button class="button" id="toggleRaw">显示 / 隐藏原始转写</button><button class="button" id="copyMarkdown">复制全文 Markdown</button></div><div class="raw" id="raw">${esc(transcript.raw||'')}</div>`;$('#toggleRaw').onclick=()=>$('#raw').classList.toggle('show');$('#copyMarkdown').onclick=()=>{sync();const markdown=sections.map(section=>`## ${section.heading}\n\n${(section.paragraphs||[]).map(paragraph=>paragraph.text).join('\n\n')}`).join('\n\n');copyText(`# ${readable.title||source.title}\n\n${markdown}`);toast('已复制 Markdown')}}
function renderX(){const posts=(x.single_posts||[]).map((post,index)=>`<div class="post"><div class="editable" data-x-post="${index}" contenteditable="true">${esc(post.text)}</div><div class="post-tools"><button class="button small" onclick="copyXPost(${index})">复制</button></div></div>`).join('');const threads=(x.threads||[]).map((thread,threadIndex)=>`<section class="panel"><h2>Thread ${threadIndex+1}</h2>${thread.map((post,index)=>`<div class="post thread-item editable" data-index="${index+1}" data-thread="${threadIndex}" data-thread-item="${index}" contenteditable="true">${esc(post.text)}</div>`).join('')}<button class="button" onclick="copyThread(${threadIndex})">复制 Thread</button></section>`).join('');$('#xRoot').innerHTML=`<div class="kicker">X PUBLISHING</div><h1>独立文案</h1><div class="social-layout"><section><h2>Single posts</h2>${posts||'<div class="empty">尚未生成 X 文案</div>'}</section><section>${threads||'<div class="empty">尚未生成 Thread</div>'}</section></div>`}
window.copyXPost=index=>{sync();copyText((x.single_posts[index]||{}).text||'');toast('已复制 X 文案')};window.copyThread=index=>{sync();copyText((x.threads[index]||[]).map(post=>post.text).join('\n\n'));toast('已复制 Thread')};
function cardClass(card){return card.kind==='cover'?'card-cover':'card-content'}
function renderCards(){xhs.theme=$('#theme').value=xhs.theme||'editorial-red';$('#themeNote').textContent=themeNotes[xhs.theme]||'';const options=xhs.title_options||[];$('#xhsCopy').innerHTML=`<h2>标题与发布文案</h2><p class="kicker">PRIMARY TITLE</p><h3 class="editable" data-xhs-title contenteditable="true">${esc(options[0]||'')}</h3>${options.length>1?`<div class="title-options">${options.slice(1).map(title=>`<span class="title-chip">${esc(title)}</span>`).join('')}</div>`:''}<p class="editable xhs-copy" data-xhs-caption contenteditable="true">${esc(xhs.caption||'')}</p>`;$('#cards').innerHTML=(xhs.cards||[]).map((card,index)=>`<div class="card-wrap"><article class="xhs-card ${cardClass(card)} theme-${esc(xhs.theme)}" data-card-index="${index}" data-number="${String(index+1).padStart(2,'0')}">${card.image?`<img class="cover-art" src="${esc(card.image)}" alt=""><span class="cover-shade"></span>`:''}<div><div class="eyebrow editable" contenteditable="true" data-card-field="eyebrow">${esc(card.eyebrow||'')}</div><h2 class="editable" contenteditable="true" data-card-field="title">${esc(card.title||'新卡片')}</h2><div class="body editable" contenteditable="true" data-card-field="body">${esc(card.body||'')}</div></div><footer><span>${String(index+1).padStart(2,'0')} / ${String(xhs.cards.length).padStart(2,'0')}</span></footer></article><div class="card-tools"><button onclick="moveCard(${index},-1)">←</button><button onclick="moveCard(${index},1)">→</button><button onclick="copyCard(${index})">复制文字</button><button onclick="exportCard(${index})">导出 PNG</button><button onclick="duplicateCard(${index})">复制卡片</button><button onclick="deleteCard(${index})">删除</button></div></div>`).join('')||'<div class="empty">点击“新增卡片”开始编辑</div>'}
function sync(){const first=selector=>document.querySelector(selector)?.innerText.trim();if(first('[data-readable-title]'))readable.title=first('[data-readable-title]');if(first('[data-reader-title]'))readable.title=first('[data-reader-title]');if(document.querySelector('[data-reader-dek]'))readable.dek=first('[data-reader-dek]');if(document.querySelector('[data-recommendation]'))digest.recommendation=first('[data-recommendation]');if(document.querySelector('[data-summary]'))digest.summary=first('[data-summary]');document.querySelectorAll('[data-insight]').forEach(element=>digest.insights[+element.dataset.insight].text=element.innerText.trim());document.querySelectorAll('[data-quote]').forEach(element=>digest.quotes[+element.dataset.quote].text=element.innerText.trim());document.querySelectorAll('[data-section-heading]').forEach(element=>readable.sections[+element.dataset.sectionHeading].heading=element.innerText.trim());document.querySelectorAll('.transcript-paragraph').forEach(element=>{for(const section of readable.sections||[]){const paragraph=(section.paragraphs||[]).find(item=>item.id===element.dataset.paragraphId);if(paragraph)paragraph.text=element.innerText.trim()}});document.querySelectorAll('[data-x-post]').forEach(element=>x.single_posts[+element.dataset.xPost].text=element.innerText.trim());document.querySelectorAll('[data-thread]').forEach(element=>x.threads[+element.dataset.thread][+element.dataset.threadItem].text=element.innerText.trim());if(document.querySelector('[data-xhs-title]')){xhs.title_options=xhs.title_options||[];xhs.title_options[0]=first('[data-xhs-title]')}if(document.querySelector('[data-xhs-caption]'))xhs.caption=first('[data-xhs-caption]');document.querySelectorAll('.xhs-card').forEach(element=>element.querySelectorAll('[data-card-field]').forEach(field=>xhs.cards[+element.dataset.cardIndex][field.dataset.cardField]=field.innerText.trim()))}
window.moveCard=(index,direction)=>{sync();const target=index+direction;if(target<0||target>=xhs.cards.length)return;[xhs.cards[index],xhs.cards[target]]=[xhs.cards[target],xhs.cards[index]];renderCards()};window.duplicateCard=index=>{sync();xhs.cards.splice(index+1,0,JSON.parse(JSON.stringify(xhs.cards[index])));renderCards()};window.deleteCard=index=>{sync();xhs.cards.splice(index,1);renderCards()};window.copyCard=index=>{sync();const card=xhs.cards[index]||{};copyText([card.eyebrow,card.title,card.body].filter(Boolean).join('\n\n'));toast('已复制卡片文字')};
async function cardPng(index,download=true){sync();const card=document.querySelector(`.xhs-card[data-card-index="${index}"]`);if(!card)return;const clone=card.cloneNode(true);clone.querySelectorAll('[contenteditable]').forEach(element=>element.removeAttribute('contenteditable'));clone.querySelectorAll('img').forEach(element=>element.remove());const css=[...document.querySelectorAll('style')].map(style=>style.textContent).join('\n');const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="540" height="720"><foreignObject width="540" height="720"><div xmlns="http://www.w3.org/1999/xhtml"><style>${css}</style>${clone.outerHTML}</div></foreignObject></svg>`;const image=new Image();await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=reject;image.src=`data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`});const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1440;const context=canvas.getContext('2d');context.scale(2,2);context.drawImage(image,0,0,540,720);const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(download){const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=`xiaohongshu-${String(index+1).padStart(2,'0')}.png`;link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000)}return blob}
window.exportCard=async index=>{try{await cardPng(index);toast('已导出 1080 × 1440 PNG')}catch(error){console.error(error);toast('浏览器导出失败，请使用批量导出脚本')}};
$('#theme').onchange=event=>{sync();xhs.theme=event.target.value;renderCards()};$('#addCard').onclick=()=>{sync();xhs.cards.push({kind:'insight',eyebrow:'KEY IDEA',title:'新卡片',body:'',source_paragraph_ids:[]});renderCards()};$('#copyCaption').onclick=()=>{sync();copyText(`${(xhs.title_options||[])[0]||''}\n\n${xhs.caption||''}`.trim());toast('已复制无链接发布文案')};$('#exportAllCards').onclick=async()=>{for(let index=0;index<(xhs.cards||[]).length;index+=1){await cardPng(index);await new Promise(resolve=>setTimeout(resolve,180))}toast('已导出全部卡片')};
$('#saveJson').onclick=()=>{sync();const blob=new Blob([JSON.stringify(state,null,2)+'\n'],{type:'application/json'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='project.edited.json';link.click();URL.revokeObjectURL(link.href);toast('已导出项目 JSON')};
renderDigest();renderQuotes();renderReader();renderX();renderCards();
</script>
</body>
